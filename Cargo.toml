[workspace]
resolver = "3"
members = [
    "crates/portcullis-core",
    "crates/portcullis-sql",
    "crates/portcullis-db",
    "crates/portcullis-engine",
    "crates/portcullis-mcp",
    "crates/portcullis-http",
    "crates/portcullis-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
portcullis-core = { path = "crates/portcullis-core", version = "0.2.0" }
portcullis-sql = { path = "crates/portcullis-sql", version = "0.2.0" }
portcullis-db = { path = "crates/portcullis-db", version = "0.2.0", default-features = false }
portcullis-engine = { path = "crates/portcullis-engine", version = "0.2.0" }
portcullis-mcp = { path = "crates/portcullis-mcp", version = "0.2.0" }
portcullis-http = { path = "crates/portcullis-http", version = "0.2.0" }

async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
http = "1"
http-body-util = "0.1"
# rust_crypto keeps token verification pure Rust: no C toolchain, and one
# fewer native library to patch in an air-gapped install.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# Native roots so an internal CA in the OS trust store is picked up.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"] }
tower = "0.5"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
indexmap = { version = "2.14", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
owo-colors = "4.4"
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11"
# The driver features come from portcullis-db's own `postgres` / `mysql` features.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "macros",
    "chrono", "uuid", "rust_decimal", "json",
] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "signal", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.26", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
