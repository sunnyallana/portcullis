# A worked Portcullis deployment: order lookup and refunds for a support team.
#
# The SQL Server flavour of examples/orders.toml. Load
# examples/sqlserver-schema.sql first, then:
#     portcullis validate --config examples/orders-sqlserver.toml
#     portcullis call --config examples/orders-sqlserver.toml --action find_order --arg order_no=8812
#     portcullis serve --config examples/orders-sqlserver.toml
#
# SQL Server support is behind a feature flag, because it is a second driver
# stack rather than another sqlx dialect:
#     cargo build --release --features mssql
#
# Two differences from the other two files, both forced by T-SQL:
#
#   - `refund_id` is a real `uniqueidentifier`, so the parameter is typed
#     `uuid` rather than the 36-character text MySQL needs.
#   - There is no upsert. `mode = "upsert"` is refused at validation rather
#     than compiled into a MERGE or a racing IF EXISTS.

[server]
name = "orders"
# Salt for `hash` masking. Keep it stable; changing it changes every digest.
mask_salt = "env:PORTCULLIS_MASK_SALT"

[backend]
kind = "sqlserver"
dsn = "env:MSSQL_URL"
schemas = ["dbo"]
max_connections = 5

[audit]
path = "portcullis-audit.jsonl"
fsync = "batch"

[approvals]
path = "portcullis-approvals.jsonl"
ttl_secs = 604800   # a week

[limits]
max_rows = 500
max_request_bytes = 65536

# --- Who may do what -------------------------------------------------------
#
# `attributes` are the only values a row_filter can reference. They come from
# here, never from a tool argument, which is what makes the scoping hold.

[[role]]
name = "support_eu"
allow = ["find_order", "list_open_orders", "refund_order"]
attributes = { region = "EU" }

[[role]]
name = "support_us"
allow = ["find_order", "list_open_orders", "refund_order"]
attributes = { region = "US" }

[[role]]
name = "auditor"
allow = ["find_order", "list_open_orders"]
attributes = { region = "EU" }

# --- Actions ---------------------------------------------------------------

[action.find_order]
description = "Look up one order by its order number."
table = "orders"
params = { order_no = { type = "text", required = true, description = "The order number, e.g. 8812", max_len = 32 } }
returns = ["order_no", "status", "placed_at", "total", "customer_email", "card_last4"]
filter = "order_no = :order_no"
row_filter = "region = $caller.region"
mask = { customer_email = "partial", card_last4 = "last4" }
max_rows = 1
timeout = "10s"

[action.list_open_orders]
description = "List orders that are not yet shipped, newest first. Optionally filter by status or minimum value."
table = "orders"
params = { status = { type = "text", required = false, one_of = ["open", "held"], description = "Restrict to one status" }, min_total = { type = "decimal", required = false, description = "Only orders at or above this amount" } }
returns = ["order_no", "status", "placed_at", "total", "customer_email"]
filter = "status in ('open', 'held') and status = :status and total >= :min_total"
row_filter = "region = $caller.region"
mask = { customer_email = "partial" }
order_by = ["placed_at desc"]
max_rows = 50
rate_limit = 60
timeout = "15s"

[action.refund_order]
description = "Issue a refund against an order. Refunds above 500 are held for human approval."
table = "refunds"
params = { refund_id = { type = "uuid", required = true, description = "A UUID for this refund" }, order_no = { type = "text", required = true, max_len = 32 }, amount = { type = "decimal", required = true, description = "Amount to refund, e.g. \"49.99\"" }, reason = { type = "text", required = true, max_len = 280, description = "Why the refund is being issued" } }
row_filter = "region = $caller.region"

[action.refund_order.write]
mode = "insert"
columns = { refund_id = ":refund_id", order_no = ":order_no", amount = ":amount", reason = ":reason", issued_by = "$caller.id", issued_at = "now()" }
idempotency = ["order_no", "amount"]
# No RETURNING in T-SQL, so the backend reads the row back by its primary key
# on the same connection. That works here because the write supplies
# `refund_id`; an action that leaves the key to an IDENTITY column cannot ask
# for columns back.
returning = ["refund_id", "order_no", "amount", "issued_at"]

[action.refund_order.approval]
over_param = "amount"
over_amount = "500.00"
