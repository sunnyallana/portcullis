name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Build without PostgreSQL
        run: cargo check --workspace --no-default-features

      - name: The demo still runs
        shell: bash
        run: |
          cargo run --quiet --bin sluice -- init ./ci-demo
          cargo run --quiet --bin sluice -- validate --config ./ci-demo/sluice.toml
          cargo run --quiet --bin sluice -- call --config ./ci-demo/sluice.toml \
            --action find_order --arg order_no=8812 --role support_eu --caller ci --json
          cargo run --quiet --bin sluice -- audit verify --config ./ci-demo/sluice.toml

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories bans licenses sources
