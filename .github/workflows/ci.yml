name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Build without PostgreSQL
        run: cargo check --workspace --no-default-features

      - name: The demo still runs
        shell: bash
        run: |
          cargo run --quiet --bin portcullis -- init ./ci-demo
          cargo run --quiet --bin portcullis -- validate --config ./ci-demo/portcullis.toml
          cargo run --quiet --bin portcullis -- call --config ./ci-demo/portcullis.toml --action find_order --arg order_no=8812 --role support_eu --caller ci --json
          cargo run --quiet --bin portcullis -- audit verify --config ./ci-demo/portcullis.toml

  postgres:
    name: live PostgreSQL
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:portcullis-test@localhost:5432/portcullis
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: portcullis-test
          POSTGRES_DB: portcullis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Load the demo schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f examples/postgres-schema.sql

      - name: Backend integration tests
        run: cargo test -p portcullis-db --test postgres_live
        env:
          PORTCULLIS_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: The same actions, end to end
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          src = Path("examples/orders.toml").read_text()
          src = src.replace('kind = "memory"\nfixtures = "demo-data.json"',
                            'kind = "postgres"\ndsn = "env:DATABASE_URL"\nschemas = ["public"]')
          # doctor fails the job on the example salt, which is the point of it.
          src = src.replace('mask_salt = "change-me-in-production"', 'mask_salt = "ci"')
          Path("/tmp/orders-pg.toml").write_text(src)
          EOF
          cargo run --quiet --bin portcullis -- doctor --config /tmp/orders-pg.toml
          cargo run --quiet --bin portcullis -- call --config /tmp/orders-pg.toml --action find_order --arg order_no=8812 --role support_eu --caller ci --json
          cargo run --quiet --bin portcullis -- audit verify --config /tmp/orders-pg.toml

  mysql:
    name: live MySQL
    runs-on: ubuntu-latest
    env:
      MYSQL_URL: mysql://root:portcullis-test@127.0.0.1:3306/portcullis
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: portcullis-test
          MYSQL_DATABASE: portcullis
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot -pportcullis-test --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Load the demo schema
        run: mysql -h127.0.0.1 -P3306 -uroot -pportcullis-test portcullis < examples/mysql-schema.sql

      - name: Backend integration tests
        run: cargo test -p portcullis-db --features mysql --test mysql_live
        env:
          PORTCULLIS_TEST_MYSQL_URL: ${{ env.MYSQL_URL }}

      - name: The same actions, end to end
        env:
          PORTCULLIS_MASK_SALT: ci
        run: |
          cargo run --quiet --bin portcullis -- doctor --config examples/orders-mysql.toml
          cargo run --quiet --bin portcullis -- call --config examples/orders-mysql.toml --action find_order --arg order_no=8812 --role support_eu --caller ci --json
          cargo run --quiet --bin portcullis -- audit verify --config examples/orders-mysql.toml

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories bans licenses sources
