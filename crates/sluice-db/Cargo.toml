[package]
name = "sluice-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sluice backends: pooled PostgreSQL, plus an in-memory backend for tests and the demo."

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "dep:chrono", "sqlx?/postgres"]
mysql = ["dep:sqlx", "dep:chrono", "sqlx?/mysql"]

[lints]
workspace = true

[dependencies]
sluice-core.workspace = true
sluice-sql.workspace = true
async-trait.workspace = true
indexmap.workspace = true
jiff.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
uuid.workspace = true
chrono = { version = "0.4", optional = true, default-features = false, features = ["std", "clock"] }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
indexmap.workspace = true
sluice-sql.workspace = true
