[package]
name = "sluice-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The sluice command line."

[[bin]]
name = "sluice"
path = "src/main.rs"

[features]
default = ["postgres"]
postgres = ["sluice-engine/postgres"]

[lints]
workspace = true

[dependencies]
sluice-core.workspace = true
sluice-db.workspace = true
sluice-engine.workspace = true
sluice-http.workspace = true
sluice-mcp.workspace = true
clap.workspace = true
jiff.workspace = true
owo-colors.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
